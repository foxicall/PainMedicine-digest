name: Validate application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:pipeline
      - run: npm run build
      - name: Build standalone preview
        run: node scripts/build-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pain-medicine-preview
          path: preview.html
          if-no-files-found: error
