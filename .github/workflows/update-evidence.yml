name: Refresh evidence and publish
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: evidence-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection and retention logic
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Retrieve all indexed evidence
        id: collect
        continue-on-error: true
        run: python scripts/update_evidence.py
      - name: Commit refreshed snapshot or failure status
        env:
          SNAPSHOT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/evidence.json data/evidence-preview.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh pain medicine evidence snapshot'
            git push origin "HEAD:$SNAPSHOT_BRANCH"
          fi
  # GITHUB_TOKEN commits do not trigger push workflows: explicitly publish here.
  publish:
    needs: refresh
    uses: ./.github/workflows/pages.yml
  report-failure:
    needs: [refresh, publish]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'At least one evidence feed failed; its previous snapshot and successful timestamp were retained. Check the collection log.'
          exit 1
